<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>agent-vitals</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header data-tauri-drag-region>
    <span class="title" data-tauri-drag-region>agent-vitals</span>
    <button id="close" title="隐藏" aria-label="隐藏">×</button>
  </header>

  <main>
    <section class="stat today">
      <div class="label">今日成本</div>
      <div class="amount" id="today-amount">—</div>
      <div class="sub" id="today-sub"></div>
    </section>

    <section class="stat month">
      <div class="label">本月成本</div>
      <div class="amount" id="month-amount">—</div>
      <div class="sub" id="month-sub"></div>
    </section>

    <section class="stat budget">
      <div class="label">预算</div>
      <div class="bar">
        <div class="fill" id="budget-fill"></div>
      </div>
      <div class="sub" id="budget-sub"></div>
    </section>

    <section class="days">
      <div class="label">本月逐日</div>
      <ul id="days-list"></ul>
      <div class="empty" id="days-empty" hidden>本月还没有数据</div>
    </section>
  </main>

  <footer>
    <div id="note"></div>
    <div class="sync">
      <span id="sync-status"></span>
      <button id="sync-now" hidden>立即同步</button>
    </div>
  </footer>
  <script src="main.js"></script>
</body>
</html>
