[workspace]
members = [".", "crates/agent-vitals-adapters", "crates/agent-vitals-domain", "crates/agent-vitals-wasm", "crates/vitals-core"]
# wasm crate 只在 `wasm-pack build --target wasm32` 下构建，不参与宿主侧的
# 默认 test/build/clippy —— 否则 `cargo test` 会为 aarch64-apple-darwin 编译
# wasm-bindgen 入口，既无意义又可能触发非 wasm 目标的告警。
#
# vitals-core（docs/VITALS_CORE_V0_5_IMPLEMENTATION_SPEC.md）在 default-members
# 里：M0 阶段它不接入 CLI/agent-vitals-domain（§5.2 单向依赖只允许反过来），
# 但必须参与默认 `cargo test`/`cargo clippy`，否则它的边界测试
# （crates/vitals-core/tests/dependency_boundary.rs）不会被 CI 跑到。
default-members = [".", "crates/agent-vitals-adapters", "crates/agent-vitals-domain", "crates/vitals-core"]
resolver = "2"

[package]
name = "agent-vitals"
version = "1.3.0"
edition = "2021"
rust-version = "1.74"
description = "Health check for the Agent Skills installed on your machine"
repository = "https://github.com/MixLabPro/agent-vitals"
license = "MIT"

[[bin]]
name = "agent-vitals"
path = "src/main.rs"

[dependencies]
agent-vitals-adapters = { path = "crates/agent-vitals-adapters" }
agent-vitals-domain = { path = "crates/agent-vitals-domain" }
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
# preserve_order 不是可选项：Python 的 dict 保持插入顺序，serde_json 的 Map
# 默认按 key 重排。少了它，输出 diff 不可读、快照对比全是噪声，golden 也对不上。
# —— ENGINEERING §3 第 4 条
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
walkdir = "2"
# DSH 会话日志的增量多帧 zstd 解压（R2a §6.3-1）。纯 Rust、零 C 依赖——设计决策
# 2026-08-30（用户拍板）：桌面/Tauri 运行时加 zstd crate 与「宿内 skill 零第三方库」
# 是两条约束，前者不违反后者（spec §7.1 G1 管的是分发的 Python skill）。
ruzstd = "0.8"
# WorkBuddy 会话审计的 sqlite 读取（`~/.workbuddy/workbuddy.db`）。仓库第一个 sqlite
# reader；`bundled` 特性自带 sqlite3.c，不依赖系统 sqlite。「宿内 skill 零第三方库」
# 同样只管分发的 Python skill——Python 侧用 stdlib `sqlite3`，Rust 二进制加 rusqlite
# 不违反它（ruzstd 同款决策）。core crate 保持纯净，I/O 只在这里。
rusqlite = { version = "0.31", features = ["bundled"] }

# 仅开发期依赖，**不进二进制**。与 Python 侧的 hypothesis 同一性质：
# 仓库的「零依赖」约束针对的是被分发的扫描器，不是测试工具。
[dev-dependencies]
proptest = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
