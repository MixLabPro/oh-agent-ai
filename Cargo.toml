[workspace]
members = [".", "crates/agent-vitals-core", "crates/agent-vitals-wasm"]
# wasm crate 只在 `wasm-pack build --target wasm32` 下构建，不参与宿主侧的
# 默认 test/build/clippy —— 否则 `cargo test` 会为 aarch64-apple-darwin 编译
# wasm-bindgen 入口，既无意义又可能触发非 wasm 目标的告警。
default-members = [".", "crates/agent-vitals-core"]
resolver = "2"

[package]
name = "agent-vitals"
version = "1.3.0"
edition = "2021"
rust-version = "1.74"
description = "Health check for the Agent Skills installed on your machine"
repository = "https://github.com/MixLabPro/agent-vitals"
license = "MIT"

[[bin]]
name = "agent-vitals"
path = "src/main.rs"

[dependencies]
agent-vitals-core = { path = "crates/agent-vitals-core" }
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
# preserve_order 不是可选项：Python 的 dict 保持插入顺序，serde_json 的 Map
# 默认按 key 重排。少了它，输出 diff 不可读、快照对比全是噪声，golden 也对不上。
# —— ENGINEERING §3 第 4 条
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
walkdir = "2"

# 仅开发期依赖，**不进二进制**。与 Python 侧的 hypothesis 同一性质：
# 仓库的「零依赖」约束针对的是被分发的扫描器，不是测试工具。
[dev-dependencies]
proptest = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
