# dsh-agent-vitals-audit bundle patch. Exactly one insert row: it mounts this
# package's host half (index.js, a no-op cordis plugin) so the client-modules
# node half scans it into window.__DSH_BOOT__ and serves client.js — the Web
# GUI 「审计」 conversation-view tab. The scanner only walks loader entries,
# so without this insert `dsh plugin add` installs the package as a dead
# dependency and the tab never appears.

- insert:
    - id: agent-vitals-audit
      name: dsh-agent-vitals-audit
