name: Verify dsh-client

# dsh-client/scripts/verify.mjs 和 verify-host.mjs 本该在构建产物变化时兜底
# __ModuleLoader__ 交接协议，但在 2026-08 从手写 JS 迁到 tsup 时，两个脚本
# 里硬编码的产物路径（client.js/index.js）没跟着改到 lib/，也从未接进任何
# workflow —— 于是两个脚本静默失效，构建产物里连续两个 bug（footer 括号顺序
# 导致语法错误、factory 里引用未注入的 `module`）直接在生产环境让用户撞见，
# 而不是在这里。这条 workflow 只做一件事：不让这种「脚本存在但没人跑」的
# 状态再发生一次。

on:
  push:
    branches: [main, "refactor/**", "merge/**"]
    paths:
      - "dsh-client/**"
      - ".github/workflows/verify-dsh-client.yml"
  pull_request:
    paths:
      - "dsh-client/**"
      - ".github/workflows/verify-dsh-client.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: build + verify + verify:host
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsh-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 安装依赖（verify-host.mjs 需要 zod）
        run: npm install --legacy-peer-deps
      - name: build + verify + verify:host
        run: npm test
