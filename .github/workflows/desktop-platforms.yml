name: Windows and Linux desktop packages

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/agent-*/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/**'
      - '.github/workflows/desktop-platforms.yml'
      - '.github/workflows/release-desktop.yml'
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows
            bundles: nsis
          - runner: ubuntu-22.04
            platform: linux
            bundles: deb,appimage
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/ui-dev/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Verify platform configuration
        run: |
          node scripts/verify-desktop-platforms.mjs
          node scripts/test-run-npm.mjs
      - name: Install frontend dependencies
        run: npm ci --prefix apps/desktop/ui-dev
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Build native desktop installers
        working-directory: apps/desktop/src-tauri
        env:
          NO_STRIP: 'true'
        run: cargo tauri build --ci --bundles ${{ matrix.bundles }}
      - name: Test bundled CLI discovery
        working-directory: apps/desktop/src-tauri
        run: cargo test --lib resolve_binary_
      - name: Verify Linux package CLI
        if: runner.os == 'Linux'
        run: |
          set -eu
          deb=$(find apps/desktop/src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)
          test -n "$deb"
          dpkg-deb -x "$deb" package-check
          # 品牌改名：菜单显示名必须是 Oh Agent；deb 包名（Package）是包管理器身份，只记录不断言（见改名方案 §2）。
          dpkg-deb -f "$deb" Package Version Architecture
          desktop_entry=$(find package-check/usr/share/applications -name '*.desktop' -print -quit)
          test -n "$desktop_entry"
          grep -qx 'Name=Oh Agent' "$desktop_entry" || { echo "desktop entry is not named Oh Agent:" >&2; cat "$desktop_entry" >&2; exit 1; }
          cli=$(find package-check/usr -path '*/bin/agent-vitals' ! -path '*/usr/bin/agent-vitals' -print -quit)
          test -n "$cli"
          test -x "$cli"
          "$cli" --build-info
          test -n "$(find apps/desktop/src-tauri/target/release/bundle/appimage -name '*.AppImage' -print -quit)"
      - name: Verify Windows installer CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (!$installer) { throw 'Missing NSIS installer' }
          if (!$installer.Name.StartsWith('Oh Agent')) { throw "Installer is not named Oh Agent: $($installer.Name)" }
          $installDir = Join-Path $env:RUNNER_TEMP 'Agent Vitals package check'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList "/S /D=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $cli = Join-Path $installDir 'bin/agent-vitals.exe'
          if (!(Test-Path $cli)) { throw 'Missing installed CLI resource' }
          & $cli --build-info
          if ($LASTEXITCODE -ne 0) { throw 'Installed CLI failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-x86_64
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
