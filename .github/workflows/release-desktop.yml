name: Release macOS desktop app

on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing app-v* tag to publish"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: build and notarize macOS app
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Validate release tag
        shell: bash
        run: |
          set -eu
          case "$RELEASE_TAG" in
            app-v*) ;;
            *) echo "release tag must start with app-v*: $RELEASE_TAG" >&2; exit 1 ;;
          esac

      - name: Require release signing credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -eu
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name-}"
            if [ -z "$value" ]; then
              echo "missing required release secret: $name" >&2
              exit 1
            fi
          done

      - name: Build bundled CLI
        run: cargo build --release

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Build signed app and DMG
        working-directory: apps/desktop/src-tauri
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: cargo tauri build --bundles app,dmg

      - name: Verify signed app and bundled CLI
        run: node scripts/verify-macos-app-bundle.mjs --require-developer-id

      - name: Verify notarization ticket
        run: xcrun stapler validate apps/desktop/src-tauri/target/release/bundle/macos/agent-vitals.app

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent-vitals-macos-${{ inputs.release_tag || github.ref_name }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/macos/agent-vitals.app
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish:
    name: publish macOS app release
    needs: build
    runs-on: macos-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: agent-vitals-macos-${{ inputs.release_tag || github.ref_name }}
          path: dist

      - name: Publish app and DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent \
            dist/macos/agent-vitals.app \
            release/agent-vitals-${RELEASE_TAG}.app.zip
          cp dist/dmg/*.dmg release/
          (cd release && shasum -a 256 *.zip *.dmg > SHA256SUMS)
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" release/*
