[package]
name = "agent-vitals-core"
version = "1.3.0"
edition = "2021"
rust-version = "1.74"
description = "Compatibility facade re-exporting agent-vitals-contracts + agent-vitals-domain"
repository = "https://github.com/MixLabPro/agent-vitals"
license = "MIT"

[lib]
name = "agent_vitals_core"
path = "src/lib.rs"

[dependencies]
# Phase C Step 4a/4b：契约与 domain 计算各自独立成 crate。`agent-vitals-core`
# 退成**纯 re-export facade**——`lib.rs` 把 `agent_vitals_core::{evidence,
# behavior,cost,…}` 旧扁平路径转发给这两个 crate，二进制 / wasm / adapters
# 的 123 处调用点与全部测试因此零改动。core 自身不再有 `src/` 计算代码，
# 也不再直接依赖 regex / serde_json / vitals-core（经 domain 传递）。
agent-vitals-contracts = { path = "../agent-vitals-contracts" }
agent-vitals-domain = { path = "../agent-vitals-domain" }
