[package]
name = "agent-vitals-adapters"
version = "1.3.0"
edition = "2021"
rust-version = "1.74"
description = "Pure host protocol adapters for Agent Vitals"
repository = "https://github.com/MixLabPro/agent-vitals"
license = "MIT"

[lib]
name = "agent_vitals_adapters"
path = "src/lib.rs"

[dependencies]
agent-vitals-core = { path = "../agent-vitals-core" }
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
vitals-core = { path = "../vitals-core" }
