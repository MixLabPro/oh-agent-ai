[package]
name = "agent-vitals-wasm"
version = "1.3.0"
edition = "2021"
rust-version = "1.74"
description = "Browser wasm build of agent-vitals: pure behavior audit over in-memory events"
repository = "https://github.com/MixLabPro/agent-vitals"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
agent-vitals-core = { path = "../agent-vitals-core" }
wasm-bindgen = "0.2"
# preserve_order 与 core 同一理由：findings 键序必须与 CLI 逐字节一致。
serde_json = { version = "1", features = ["preserve_order"] }

# wasm-opt 需要下载 binaryen（网络依赖），跳过它——release 编译已做优化，
# 产物略大但功能等价，也去掉一次对外下载。
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
