[package]
name = "agent-vitals-runtime"
version = "1.4.0"
edition = "2021"
rust-version = "1.74"
description = "Non-host local machinery for Agent Vitals: HomeResolver, state store, ledger, session/skill services"
repository = "https://github.com/MixLabPro/agent-vitals"
license = "MIT"

[lib]
name = "agent_vitals_runtime"
path = "src/lib.rs"

# v0.8 Phase D6/D7：`agent-vitals-runtime` 装**非宿主**的本机机器——唯一
# `HomeResolver`、state/ledger 存储、Skill/Session service 编排。依赖
# `agent-vitals-hosts`（`features = ["sources"]`）+ `agent-vitals-domain`（正向）。
# v0.9 Stage 0.4 起也依赖 `agent-vitals-data`——spec §3.1 依赖表把
# `agent-vitals-data` 的允许依赖限定在 domain，够不到 hosts/runtime，
# `SummaryRepository` trait（`agent-vitals-data::repository`）的具体实现
# 因此住在这里（唯一同时看得到 hosts 与 data 的 crate），不是 data 自己实现
# （docs/AGENT_VITALS_V0_9_STAGE0_RESEARCH.md §8.1）。
# `notify`：2026-09-22 产品拍板（P2_WATCHER_PRODUCT_REVIEW.md 方案 A）后解除禁令，
# 但**只在 `watcher` feature 下引入**（`optional = true`，desktop 显式启用）——
# 默认构建（CLI / wasm）零该依赖，NoopWatcher 路径照常（Vite 同款，spec §9-P2）。
# `tokio`/`chrono` 仍是纪律禁项（async 化与双时间口径的入口，未评审不得放开）。

# 内部 MCP 工具门控（增量 7.5 `query_sql_readonly` / 增量 6 `authority_audit`）。
# 公开构建（默认 feature = []）不含这些工具——spec §8.2 / M0 D4 的承诺。
# 调试 Agent 用 `cargo run --features mcp-internal -- data-mcp serve`。
#
# `legacy-r2a`：v0.9.1 PR #4 起，jsonl 回放路径（`sessions/r2a_store.rs` 的
# `SessionStore` + `extract_summary` + `cache_v2_*` + `sessions_list/read/
# findings/navigation`）整体 behind this feature。CLI 显式 enable（保本次
# 升级无回退——`sessions findings` 在 M4 `workflow_events` 工具落地前还得走
# jsonl 路径，见 task #19）；desktop / wasm 默认不开（它们已迁到
# `mcp::dispatch("sessions_search" | "session_detail", ...)`，spec §3.1）。
# v0.9.2 改默认关 → v0.9.3 删整个文件（PR #5）。
[features]
mcp-internal = []
legacy-r2a = []
# P2 watcher（SourceGraph spec §9-P2）：notify 6.x（macOS FSEvents / Linux
# inotify）文件事件 → 去抖 → 唤醒 tick 对账 + watch-only 消费者。不开 =
# NoopWatcher（tick 5min 兜底照常，Vite createNoopWatcher 同款）。
watcher = ["dep:notify"]

[dependencies]
agent-vitals-data = { path = "../agent-vitals-data" }
# data 质量表的参数化写入（sql_sync 的 missing_sid issue）——同版本 0.31
rusqlite = { version = "0.31", features = ["bundled"] }
agent-vitals-domain = { path = "../agent-vitals-domain" }
agent-vitals-hosts = { path = "../agent-vitals-hosts", features = ["sources"] }
agent-vitals-provider = { path = "../agent-vitals-provider" }
jiff = "0.2"
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
# v0.8 Phase E7.5：discovery.rs/security.rs 从 apps/cli 迁来的目录遍历/正则/
# 内容哈希——skills::scanner 与 skills::security 需要，其余 runtime 模块不碰。
regex = "1"
sha2 = "0.10"
walkdir = "2"
# P2 watcher 专用（feature `watcher`，见上）——平台原生后端由 notify 选择
# （macOS FSEvents / Linux inotify / Windows ReadDirectoryChangesW）。
notify = { version = "6.1", optional = true }
